apiVersion: apps/v1
kind: Deployment
metadata:
  name: test
  labels:
    app: test
spec:
  selector:
    matchLabels:
      app: test
      tier: frontend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: test
        tier: frontend
    spec:
      containers:
      - image: seshagirisriram/test 
        name: test
        ports:
        - containerPort: 80
          name: test
